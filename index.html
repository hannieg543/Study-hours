<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Tracker</title>
<style>
  :root {
    --blue: #3B82F6;
    --track: #E5E7EB;
    --text-primary: #1F2933;
    --text-secondary: #6B7280;
    --border: #E5E7EB;
    --bg: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F3F4F6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 320px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px 22px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 18px;
  }
  .header svg { flex-shrink: 0; }
  .label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .value-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 16px;
  }
  .value-row input {
    font-size: 34px;
    font-weight: 700;
    color: var(--text-primary);
    border: none;
    background: transparent;
    width: 90px;
    padding: 0;
    outline: none;
    font-family: inherit;
  }
  .value-row input:focus {
    color: var(--blue);
  }
  .goal-total {
    font-size: 18px;
    color: var(--text-secondary);
  }
  .bar-track {
    width: 100%;
    height: 8px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .bar-fill {
    height: 100%;
    background: var(--blue);
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }
  .footer .goal-text {
    color: var(--text-secondary);
  }
  .footer .goal-text input {
    width: 32px;
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    outline: none;
    font-family: inherit;
    text-align: center;
  }
  .footer .percent {
    font-weight: 600;
    color: var(--text-primary);
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <rect x="2" y="9" width="3" height="7" rx="1" fill="#3B82F6"/>
      <rect x="7.5" y="5" width="3" height="11" rx="1" fill="#3B82F6"/>
      <rect x="13" y="2" width="3" height="14" rx="1" fill="#3B82F6"/>
    </svg>
    Study Tracker
  </div>

  <div class="label">Study Hours This Week</div>

  <div class="value-row">
    <input type="number" id="hours" step="0.5" min="0" />
    <span class="goal-total">/ <span id="goalDisplay"></span></span>
  </div>

  <div class="bar-track">
    <div class="bar-fill" id="barFill"></div>
  </div>

  <div class="footer">
    <span class="goal-text">Goal: <input type="number" id="goal" step="1" min="1" /> hours</span>
    <span class="percent" id="percent"></span>
  </div>
</div>

<script>
  var hoursInput = document.getElementById('hours');
  var goalInput = document.getElementById('goal');
  var goalDisplay = document.getElementById('goalDisplay');
  var barFill = document.getElementById('barFill');
  var percentEl = document.getElementById('percent');

  function load() {
    var hours = parseFloat(localStorage.getItem('studyHours'));
    var goal = parseFloat(localStorage.getItem('studyGoal'));
    hoursInput.value = isNaN(hours) ? 14.5 : hours;
    goalInput.value = isNaN(goal) ? 20 : goal;
    render();
  }

  function render() {
    var hours = parseFloat(hoursInput.value) || 0;
    var goal = parseFloat(goalInput.value) || 1;
    var pct = Math.max(0, Math.min(100, Math.round((hours / goal) * 100)));
    goalDisplay.textContent = goal;
    barFill.style.width = pct + '%';
    percentEl.textContent = pct + '%';
    localStorage.setItem('studyHours', hours);
    localStorage.setItem('studyGoal', goal);
  }

  hoursInput.addEventListener('input', render);
  goalInput.addEventListener('input', render);

  load();
</script>

</body>
</html>
